<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    PDF スライドショー ビューア

    目的:
      PDF.js を使用して PDF ファイルをスライドショー形式で表示する。
      BrowserView の loadURL で file:// プロトコルとして読み込まれ、
      URL パラメータで PDF ファイルパスとページ表示秒数を受け取る。

    URL パラメータ:
      - file: PDF ファイルのローカル絶対パス（encodeURIComponent 済み）
      - pageDuration: 1ページあたりの表示秒数（デフォルト: 10）

    動作:
      1. PDF.js で PDF ファイルを読み込み
      2. 最初のページを canvas に描画
      3. pageDuration 秒ごとに自動的に次のページへ
      4. 最終ページに到達したら先頭に戻ってループ
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF ビューア</title>
  <link rel="stylesheet" href="css/pdf-viewer.css">
</head>
<body>

  <!-- PDF 描画用 canvas（フルスクリーン） -->
  <canvas id="pdf-canvas"></canvas>

  <!-- 読み込み中表示 -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-text">PDF を読み込み中...</div>
  </div>

  <!-- エラー表示 -->
  <div id="error-overlay" class="error-overlay" style="display: none;">
    <div class="error-text" id="error-message">PDF の読み込みに失敗しました</div>
  </div>

  <!--
    PDF.js ライブラリの読み込み
    pdfjs-dist npm パッケージから直接参照する。
    Electron の BrowserView 内で動作するため、
    Node.js の require は使えず script タグで読み込む。
  -->
  <script src="../../node_modules/pdfjs-dist/build/pdf.mjs" type="module"></script>
  <script src="js/pdf-viewer.js" type="module"></script>

</body>
</html>
